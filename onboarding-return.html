<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACKR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 40px 28px;
    text-align: center;
  }
  .mark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1a1a1a;
    margin-bottom: 28px;
  }
  .check {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 20px;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 0.2px;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    line-height: 1.5;
    color: #666;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">TRACKR.</div>
    <div class="check">&#10003;</div>
    <h1>You're all set</h1>
    <p>Close this tab and go back to TRACKR.</p>
  </div>
</body>
</html>
