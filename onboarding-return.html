<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRACKR</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
      }
      p {
        max-width: 320px;
        padding: 0 24px;
        font-size: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <p id="message"></p>
    <script>
      // stripe-onboarding-return redirects here with the same `type` query
      // param it received from Stripe, since this static page (not the
      // function) is what actually renders — see index.ts for why.
      var type = new URLSearchParams(window.location.search).get('type');
      document.getElementById('message').textContent =
        type === 'refresh'
          ? 'That link expired. Go back to TRACKR and try setting up payouts again.'
          : "You're all set. Close this tab and go back to TRACKR.";
    </script>
  </body>
</html>
